name: 'PR Verification'
run-name: "PR #${{ github.event.pull_request.number }} | ${{ github.head_ref }}"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: [pull_request]

env:
  PYTHON3_VERSION: '3.x'

jobs:
# Preflight ###########################################################################################################

  preflight:
    name: "Preflight | ubuntu"
    runs-on: ubuntu-latest
    outputs:
      run_regression:   ${{ steps.changes.outputs.run_regression }}
      build_run_id:     ${{ steps.find-artifact.outputs.build_run_id }}
      build_run_number: ${{ steps.find-artifact.outputs.build_run_number }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Detect changed files
      id: changes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        changed=$(gh api /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
          --jq '.[].filename')
        echo "Changed files:"
        echo "$changed"
        if echo "$changed" | grep -qE '(\.hlc$|^tests/)'; then
          echo "run_regression=true"  >> $GITHUB_OUTPUT
          echo "Regression triggered: .hlc or tests/ files changed."
        else
          echo "run_regression=false" >> $GITHUB_OUTPUT
          echo "Regression skipped: no .hlc or tests/ files changed."
        fi

    - name: Find most recent build artifact
      id: find-artifact
      env:
        GH_TOKEN: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}
      run: |
        # Most recent successful run in Apotell/artifacts - get id and run_number in one call
        read -r run_id run_number < <(gh api "/repos/Apotell/artifacts/actions/runs?status=completed&per_page=20" \
          --jq '[.workflow_runs[] | select(.conclusion == "success")] | first | "\(.id) \(.run_number)"')
        echo "build_run_id=$run_id"         >> $GITHUB_OUTPUT
        echo "build_run_number=$run_number" >> $GITHUB_OUTPUT
        echo "Run ID    : $run_id"
        echo "Run number: $run_number"

# Regression ##########################################################################################################

  regression:
    name: "Regression | ubuntu | filtered"
    needs: preflight
    if: needs.preflight.outputs.run_regression == 'true'
    runs-on: ubuntu-24.04

    env:
      build-artifact-name:       hlc_ubuntu_release_${{ needs.preflight.outputs.build_run_number }}
      pyuhdm-artifact-pattern:   "pyuhdm-*-linux_x86_64.whl"
      regression-artifact-name:  Regression_ubuntu_release_PR_${{ github.event.pull_request.number }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Populate filter list
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
          --jq '.[].filename' \
          | xargs -I{} dirname {} \
          | sort -u \
          > scripts/filter.lst

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON3_VERSION }}
        architecture: 'x64'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Setup Python Packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Download artifact (build)
      uses: actions/download-artifact@v7
      with:
        name:          ${{ env.build-artifact-name }}
        run-id:        ${{ needs.preflight.outputs.build_run_id }}
        repository:    Apotell/artifacts
        github-token:  ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Download artifact (pyuhdm)
      uses: actions/download-artifact@v7
      with:
        pattern:       ${{ env.pyuhdm-artifact-pattern }}
        run-id:        ${{ needs.preflight.outputs.build_run_id }}
        repository:    Apotell/artifacts
        github-token:  ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Extract build artifact
      shell: bash
      run: |
        tar xzfp ${{ env.build-artifact-name }}.tar.gz
        mv ${{ env.build-artifact-name }} build
        rm ${{ env.build-artifact-name }}.tar.gz

    - name: Run filtered regression
      shell: bash
      timeout-minutes: 60
      run: |
        python -m pip install $(ls ${{ env.pyuhdm-artifact-pattern }} | head -n 1)

        python3 scripts/regression.py                          \
          --build-dirpath ${{ github.workspace }}/build/bin    \
          --surelog-filepath surelog                           \
          --reducer-filepath uhdm-reduce                       \
          --output-dirpath ${{ github.workspace }}/regression  \
          --jobs $(nproc)                                      \
          --filters @scripts/filter.lst

    - name: Prepare regression artifacts
      if: ${{ !cancelled() }}
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        echo "$GITHUB_CONTEXT" > env.json
        mv regression/regression.csv .
        mv regression ${{ env.regression-artifact-name }}
        find ${{ env.regression-artifact-name }} -name "*.tar.gz" | tar czfp ${{ env.regression-artifact-name }}.tar.gz -T -

    - name: Archive artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.regression-artifact-name }}
        path: |
          ${{ env.regression-artifact-name }}.tar.gz
          env.json
          regression.csv

# C++ Tests ###########################################################################################################

  cpp_tests:
    name: "C++ Tests | ${{ matrix.platform }} | release"
    needs: preflight
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - platform: ubuntu
            os: ubuntu-24.04
          - platform: windows
            os: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set artifact name
      shell: bash
      run: |
        echo "build-artifact-name=hlc_${{ matrix.platform }}_release_${{ needs.preflight.outputs.build_run_number }}" >> $GITHUB_ENV

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: choco install ninja --no-progress -y

    - name: Setup Clang
      uses: egor-tensin/setup-clang@v2

    - name: Setup compiler cache
      uses: hendrikmuhs/ccache-action@v1
      with:
        variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
        key: ${{ matrix.platform }}-${{ github.ref_name }}
        restore-keys: ${{ matrix.platform }}-master

    - name: Download artifact (build)
      uses: actions/download-artifact@v7
      with:
        name:          ${{ env.build-artifact-name }}
        run-id:        ${{ needs.preflight.outputs.build_run_id }}
        repository:    Apotell/artifacts
        github-token:  ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Extract build artifact
      shell: bash
      run: |
        tar xzfp ${{ env.build-artifact-name }}.tar.gz
        mv ${{ env.build-artifact-name }} build

    - name: Configure
      shell: bash
      run: |
        cmake                                       \
          -G Ninja                                  \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo         \
          -DBUILD_DIR=${{ github.workspace }}/build \
          -S . -B out/build

    - name: Build
      shell: bash
      run: cmake --build out/build -j $(nproc 2>/dev/null || echo $NUMBER_OF_PROCESSORS)

    - name: Test
      run: ctest --test-dir out/build --output-on-failure
