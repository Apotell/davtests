name: 'unskip'
run-name: "unskip | ${{ github.ref_name }}"

# Finds GTEST_SKIP()s that are no longer needed and opens a pull request removing them:
#   1. Comment out every GTEST_SKIP() scripts/unskip.py can handle (an unconditional statement in
#      a test body whose test checks something besides the skip).
#   2. Build and run only the test files that had one, with a gtest XML report per executable.
#   3. Record which of those test cases passed.
#   4. Start again from a clean checkout of the same commit (reverting step 1).
#   5. Delete the GTEST_SKIP()s of the test cases that passed.
#   6. Commit to a new branch (fixed prefix, random suffix), push it and open a pull request.
#
# Run it from master. Every job checks out the commit the run started on, so the new branch is cut
# from that master commit. Run from another branch, the pull request would also carry that
# branch's own commits -- use dry_run there.

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report the passing tests; do not push a branch or open a pull request'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHON3_VERSION: '3.14'
  BRANCH_PREFIX: 'unskip/'
  NUM_SHARDS: 2

jobs:
# Preflight ###########################################################################################################

  preflight:
    name: "Preflight | ubuntu"
    runs-on: ubuntu-latest
    outputs:
      build_run_id: ${{ steps.find-artifact.outputs.build_run_id }}
      build_run_number: ${{ steps.find-artifact.outputs.build_run_number }}

    steps:
    - name: Find most recent build artifact
      id: find-artifact
      env:
        GH_TOKEN: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}
      run: |
        # .id            -> Apotell/artifacts run id, required by download-artifact
        # display_title  -> "hlc | #<run_number> | <run_id>"; parse run_number for artifact names
        read -r build_run_id build_run_number < <(gh api "/repos/Apotell/artifacts/actions/runs?status=completed&per_page=20" \
          --jq '[.workflow_runs[] | select(.conclusion == "success")] | first
                | "\(.id) \(.display_title | split(" | ")[1] | ltrimstr("#"))"')
        echo "build_run_id=$build_run_id"         >> $GITHUB_OUTPUT
        echo "build_run_number=$build_run_number" >> $GITHUB_OUTPUT
        echo "Run ID    : $build_run_id"
        echo "Run number: $build_run_number"

# C++ Tests (skips disabled) ##########################################################################################

  cpp_tests:
    name: "C++ Tests | ubuntu | skips disabled | shard ${{ matrix.shard }}/2"
    needs: preflight
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]  # keep in sync with NUM_SHARDS

    env:
      build-artifact-name: hlc_ubuntu_release_${{ needs.preflight.outputs.build_run_number }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Disable GTEST_SKIPs
      run: python3 scripts/unskip.py disable --filter-list scripts/filter.lst

    # shard_tests.py treats an empty filter list as "every test", so stop here when nothing was
    # disabled, and when this shard got none of the affected tests.
    - name: Generate shard list
      id: shard
      run: |
        if [ -s scripts/filter.lst ]; then
          python3 scripts/shard_tests.py          \
            --test-dirpath hlc                    \
            --output scripts/shard.lst            \
            --shard ${{ matrix.shard }}           \
            --num_shards ${{ env.NUM_SHARDS }}    \
            --filters @scripts/filter.lst
        else
          : > scripts/shard.lst
        fi
        if [ -s scripts/shard.lst ]; then
          echo "has_tests=true"  >> $GITHUB_OUTPUT
        else
          echo "has_tests=false" >> $GITHUB_OUTPUT
          echo "No test with a disabled skip in this shard."
        fi

    - name: Install Dependencies
      if: steps.shard.outputs.has_tests == 'true'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build

    - name: Setup Clang
      if: steps.shard.outputs.has_tests == 'true'
      uses: egor-tensin/setup-clang@v2

    - name: Setup compiler cache
      if: steps.shard.outputs.has_tests == 'true'
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        variant: 'ccache'
        key: "ubuntu-unskip/${{ matrix.shard }}"
        restore-keys: |
          ubuntu-master/${{ matrix.shard }}
          ubuntu-master
        evict-old-files: 'job'

    - name: Download artifact (build)
      if: steps.shard.outputs.has_tests == 'true'
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.build-artifact-name }}
        run-id: ${{ needs.preflight.outputs.build_run_id }}
        repository: Apotell/artifacts
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Extract build artifact
      if: steps.shard.outputs.has_tests == 'true'
      run: |
        tar xzfp ${{ env.build-artifact-name }}.tar.gz
        mv ${{ env.build-artifact-name }} build

    # The binary dir is the extracted hlc install itself (build/), so the test executables land in
    # build/bin next to hlc and its hlc.conf -- the same layout as other platforms. hlc loads
    # hlc.conf (and through it the precompiled UVM/OVM cache under share/hlc/pkg) from the running
    # executable's own directory, so a test binary built anywhere else silently runs uncached.
    - name: Configure
      if: steps.shard.outputs.has_tests == 'true'
      env:
        CC: clang
        CXX: clang++
      run: |
        cmake                                                         \
          -G Ninja                                                    \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo                           \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache                          \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache                        \
          -DHLC_BUILD_DIR=${{ github.workspace }}/build               \
          -DTEST_LIST_FILE=${{ github.workspace }}/scripts/shard.lst  \
          -S . -B build

    # -k 0: one test file that fails to build must not stop the others. Its test cases get no
    # report, so they count as not passed and keep their skip.
    - name: Build
      if: steps.shard.outputs.has_tests == 'true'
      env:
        # Every test compiles against the shared davtests PCH. ccache refuses to cache those
        # compiles unless it is told to accept PCH use.
        CCACHE_SLOPPINESS: pch_defines,time_macros
      run: cmake --build build -j $(nproc) -- -k 0 || echo "::warning::Some test files failed to build"

    # Failing tests are expected here (most skips are still needed), so ctest's status is ignored;
    # the per-test-case results come from the XML reports.
    - name: Test
      if: steps.shard.outputs.has_tests == 'true'
      timeout-minutes: 30
      env:
        GTEST_OUTPUT: xml:${{ github.workspace }}/gtest_xml/
      run: |
        mkdir -p gtest_xml
        ctest --test-dir build -j $(nproc) --timeout 600 --no-tests=ignore || true

    - name: Collect results
      if: steps.shard.outputs.has_tests == 'true'
      run: |
        mkdir -p gtest_xml
        python3 scripts/unskip.py collect                   \
          --xml-dirpath gtest_xml                           \
          --test-list scripts/shard.lst                     \
          --output unskip_results/shard_${{ matrix.shard }}.json

    - name: Archive results
      if: ${{ !cancelled() && steps.shard.outputs.has_tests == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: unskip_results_${{ matrix.shard }}_${{ github.run_number }}
        path: |
          unskip_results/
          gtest_xml/
          build/Testing/Temporary/LastTest.log

# Remove passing skips ################################################################################################

  unskip:
    name: "Remove passing skips"
    needs: [preflight, cpp_tests]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    # A fresh checkout of the tested commit: none of cpp_tests' edits are here.
    # The CI token (not GITHUB_TOKEN) pushes and opens the pull request, because GitHub does not
    # start other workflows (pr.yml) for a pull request opened with GITHUB_TOKEN.
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Download results
      uses: actions/download-artifact@v7
      with:
        pattern: unskip_results_*_${{ github.run_number }}
        path: results

    - name: Remove passing skips
      run: |
        mapfile -t files < <(find results -path '*/unskip_results/*.json' | sort)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No results to apply."
          echo 0 > count.txt
          exit 0
        fi
        python3 scripts/unskip.py apply   \
          --results "${files[@]}"         \
          --summary pr_body.md            \
          --count-file count.txt
        cat pr_body.md >> $GITHUB_STEP_SUMMARY
        git diff --stat

    - name: Commit, push and open pull request
      if: ${{ !inputs.dry_run }}
      env:
        GH_TOKEN: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}
      run: |
        count=$(cat count.txt)
        if [ "$count" -eq 0 ] || git diff --quiet -- hlc; then
          echo "No skip can be removed; nothing to commit."
          exit 0
        fi

        run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        branch="${BRANCH_PREFIX}$(date -u +%Y%m%d)-$(openssl rand -hex 4)"
        git config user.name  "github-actions[bot]"
        git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
        git switch -c "$branch"
        git add -- hlc
        git commit -m "Remove GTEST_SKIP from ${count} passing test case(s)" \
                   -m "Found by the unskip workflow: ${run_url}"
        git push origin "$branch"

        {
          cat pr_body.md
          echo
          echo "Found by the unskip workflow: ${run_url}"
        } > pr_body_full.md
        gh pr create                                                     \
          --base master                                                  \
          --head "$branch"                                               \
          --title "Remove GTEST_SKIP from ${count} passing test case(s)" \
          --body-file pr_body_full.md

# Cache Cleanup #######################################################################################################

  # Cache entries are immutable, so every run saves a new timestamp-suffixed
  # entry. Keep only the newest entry per key prefix on this ref so frequently
  # run branches don't push other branches' caches out of the repo-wide quota.
  CacheCleanup:
    needs: [cpp_tests]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
    - name: Delete older caches on this ref
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # Strip ccache-action's trailing ISO timestamp ("-YYYY-MM-DDT...") to
        # group entries by prefix.
        gh cache list --ref "${{ github.ref }}" --limit 1000         \
          --json id,key,createdAt                                    \
          --jq 'group_by(.key | sub("-[0-9]{4}-[0-9]{2}-[0-9]{2}[T-].*$"; ""))
                | .[] | sort_by(.createdAt) | .[:-1][] | .id'        |
        while read -r id; do
          echo "Deleting cache ${id}"
          gh cache delete "${id}"
        done
