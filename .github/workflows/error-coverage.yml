name: 'Error Coverage'
run-name: "Error Coverage | ${{ github.event.pull_request.title || github.ref_name }}"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'hlc/**'
      - 'scripts/error_coverage.py'
      - '.github/workflows/error-coverage.yml'
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      hlc_ref:
        description: 'hlc branch/tag/sha to read ErrorDefinition.h/.cpp from'
        required: false
        default: master

env:
  PYTHON3_VERSION: '3.x'

jobs:
  error-coverage:
    name: "Error Coverage | golden"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        path: davtests

    - name: Checkout hlc (error definitions only)
      uses: actions/checkout@v6
      with:
        repository: Apotell/hlc
        ref: ${{ github.event.inputs.hlc_ref || 'master' }}
        token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}
        path: hlc
        sparse-checkout: |
          include/Hlc/ErrorReporting
          src/ErrorReporting
        sparse-checkout-cone-mode: true

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON3_VERSION }}
        architecture: 'x64'
        cache: 'pip'
        cache-dependency-path: davtests/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r davtests/requirements.txt

    - name: Generate error coverage report
      run: |
        # Writes report.xlsx and summary.md, and appends summary.md to the job summary.
        python3 davtests/scripts/error_coverage.py  \
          --hlc-repo hlc                             \
          --test-dirpath davtests/hlc                \
          --output-dirpath error_coverage

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: error-coverage
        path: error_coverage
        if-no-files-found: error
