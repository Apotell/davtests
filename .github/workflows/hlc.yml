name: 'hlc'
run-name: "hlc #${{ github.event.inputs.run_number }} · ${{ github.event.inputs.context || github.ref }}"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.inputs.context || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      run_number:
        description: 'Build run number'
        type: number
        required: true
      run_id:
        description: 'Build run ID (from the url)'
        type: number
        required: true
      context:
        description: 'Triggering context (actor/branch)'
        type: string
        required: false
        default: master

env:
  PYTHON3_VERSION: '3.14'

jobs:
# Preflight ###########################################################################################################

  # Resolves the hlc build run under test once, from run_id, and hands its identity to every other
  # job. Jobs read it from needs.preflight.outputs, never from the inputs, so all of them (and the
  # env.json each one writes) agree. The run_number input is only for run-name, which GitHub
  # evaluates before any job runs; it is checked against the resolved run here.
  preflight:
    name: "Preflight | ubuntu"
    runs-on: ubuntu-latest

    outputs:
      hlc_run_id: ${{ steps.hlc-run.outputs.hlc_run_id }}
      hlc_run_number: ${{ steps.hlc-run.outputs.hlc_run_number }}
      hlc_run_attempt: ${{ steps.hlc-run.outputs.hlc_run_attempt }}
      hlc_branch: ${{ steps.hlc-run.outputs.hlc_branch }}
      hlc_sha: ${{ steps.hlc-run.outputs.hlc_sha }}

    steps:
    - name: Resolve hlc build run
      id: hlc-run
      env:
        GH_TOKEN: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}
      run: |
        gh api repos/Apotell/hlc/actions/runs/${{ github.event.inputs.run_id }}  \
          --jq '"hlc_run_id=\(.id)",
                "hlc_run_number=\(.run_number)",
                "hlc_run_attempt=\(.run_attempt)",
                "hlc_branch=\(.head_branch)",
                "hlc_sha=\(.head_sha)"' | tee -a $GITHUB_OUTPUT
        run_number=$(grep '^hlc_run_number=' $GITHUB_OUTPUT | cut -d= -f2)
        if [ "$run_number" != "${{ github.event.inputs.run_number }}" ]; then
          echo "::error::run_number input (${{ github.event.inputs.run_number }}) does not match run ${{ github.event.inputs.run_id }} (#$run_number)"
          exit 1
        fi

    - name: Verify artifacts are accessible
      env:
        GH_TOKEN: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}
      run: |
        artifacts=$(gh api /repos/Apotell/hlc/actions/runs/${{ steps.hlc-run.outputs.hlc_run_id }}/artifacts \
          --jq '.artifacts[].name')
        echo "Available artifacts:"
        echo "$artifacts"
        echo "$artifacts" | grep -q "hlc_ubuntu_release_${{ steps.hlc-run.outputs.hlc_run_number }}" \
          || { echo "::error::Build artifact not found"; exit 1; }
        echo "$artifacts" | grep -q "pyhldb-" \
          || { echo "::error::pyhldb artifact not found"; exit 1; }

# Regression ##########################################################################################################

  regression:
    name: "Regression | ${{ matrix.config.tag }} | ${{ matrix.shard }}"
    needs: preflight
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        num_shards: [6]
        shard: [0, 1, 2, 3, 4, 5]
        config:
        - { os: ubuntu-26.04, tag: ubuntu, build-type: release }
        # - { os: windows-2022, tag: windows, build-type: release }

    env:
      build-artifact-name: hlc_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ needs.preflight.outputs.hlc_run_number }}
      pyhldb-artifact-pattern: "pyhldb-*-linux_x86_64.whl"
      regression-artifact-name: Regression_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.run_number }}_${{ matrix.shard }}
      # The hlc build run under test; ci_context.py records these in env.json.
      HLC_RUN_ID: ${{ needs.preflight.outputs.hlc_run_id }}
      HLC_RUN_NUMBER: ${{ needs.preflight.outputs.hlc_run_number }}
      HLC_RUN_ATTEMPT: ${{ needs.preflight.outputs.hlc_run_attempt }}
      HLC_BRANCH: ${{ needs.preflight.outputs.hlc_branch }}
      HLC_SHA: ${{ needs.preflight.outputs.hlc_sha }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON3_VERSION }}
        architecture: 'x64'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Setup Python Packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Download artifact (build)
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.build-artifact-name }}
        run-id: ${{ env.HLC_RUN_ID }}
        repository: Apotell/hlc
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Download artifact (pyhldb)
      uses: actions/download-artifact@v7
      with:
        pattern: ${{ env.pyhldb-artifact-pattern }}
        run-id: ${{ env.HLC_RUN_ID }}
        repository: Apotell/hlc
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Extract build artifact
      shell: bash
      run: |
        # This has to be a separate step and run under bash since tar on Windows
        # still doesn't support symlink and the root repository folder is a symlink.
        tar xzfp ${{ env.build-artifact-name }}.tar.gz
        mv ${{ env.build-artifact-name }} build
        rm ${{ env.build-artifact-name }}.tar.gz

    - name: Run regression
      if: runner.os == 'Linux'
      shell: bash
      timeout-minutes: 60
      run: |
        python -m pip install $(ls ${{ env.pyhldb-artifact-pattern }} | head -n 1)

        python3 scripts/regression.py                         \
          --build-dirpath ${{ github.workspace }}/build/bin   \
          --hlc-filepath hlc                          \
          --reducer-filepath hldb-reduce                      \
          --output-dirpath ${{ github.workspace }}/regression \
          --jobs $(nproc)                                     \
          --num_shards=${{ matrix.num_shards }}               \
          --shard=${{ matrix.shard }}
        git status

    # Never dump toJson(github) here: it contains github.token. ci_context.py emits an allowlist.
    - name: Prepare regression artifacts
      if: ${{ !cancelled() }}
      run: |
        python3 scripts/ci_context.py > env.json
        mv regression/regression.csv .
        mv regression ${{ env.regression-artifact-name }}
        find ${{ env.regression-artifact-name }} -name "*.tar.gz" | tar czfp ${{ env.regression-artifact-name }}.tar.gz -T -

    - name: Archive artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.regression-artifact-name }}
        path: |
          ${{ env.regression-artifact-name }}.tar.gz
          env.json
          regression.csv

# C++ Tests ###########################################################################################################

  cpp_tests:
    name: "C++ Tests | ubuntu | release | shard ${{ matrix.shard }}/${{ matrix.num_shards }}"
    needs: preflight
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ubuntu, os: ubuntu-26.04, shard: 0, num_shards: 2 }
          - { platform: ubuntu, os: ubuntu-26.04, shard: 1, num_shards: 2 }

    env:
      build-artifact-name: hlc_${{ matrix.platform }}_release_${{ needs.preflight.outputs.hlc_run_number }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build

    - name: Setup Clang
      uses: egor-tensin/setup-clang@v2

    - name: Setup compiler cache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        variant: 'ccache'
        key: "${{ matrix.platform }}-${{ github.ref_name }}/${{ matrix.shard }}"
        restore-keys: |
          ${{ matrix.platform }}-master/${{ matrix.shard }}
          ${{ matrix.platform }}-master
        evict-old-files: 'job'

    - name: Download artifact (build)
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.build-artifact-name }}
        run-id: ${{ needs.preflight.outputs.hlc_run_id }}
        repository: Apotell/hlc
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Extract build artifact
      shell: bash
      run: |
        tar xzfp ${{ env.build-artifact-name }}.tar.gz
        mv ${{ env.build-artifact-name }} build

    - name: Generate shard list
      shell: bash
      run: |
        python3 scripts/shard_tests.py          \
          --test-dirpath hlc                    \
          --output scripts/shard.lst            \
          --shard ${{ matrix.shard }}           \
          --num_shards ${{ matrix.num_shards }}

    # The binary dir is the extracted hlc install itself (build/), so the test executables land in
    # build/bin next to hlc and its hlc.conf -- the same layout as other platforms. hlc loads
    # hlc.conf (and through it the precompiled UVM/OVM cache under share/hlc/pkg) from the running
    # executable's own directory, so a test binary built anywhere else silently runs uncached.
    - name: Configure
      env:
        CC: clang
        CXX: clang++
        SCCACHE_GHA_ENABLED: "true"
      run: |
        cmake                                                         \
          -G Ninja                                                    \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo                           \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache                          \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache                        \
          -DHLC_BUILD_DIR=${{ github.workspace }}/build               \
          -DTEST_LIST_FILE=${{ github.workspace }}/scripts/shard.lst  \
          -S . -B build

    - name: Build
      env:
        # Every test compiles against the shared davtests PCH. ccache refuses to cache those
        # compiles unless it is told to accept PCH use.
        CCACHE_SLOPPINESS: pch_defines,time_macros
      run: cmake --build build -j $(nproc)

    - name: Test
      timeout-minutes: 15
      run: ctest --test-dir build --output-on-failure -j $(nproc)

    # ctest writes every test's full output -- passing tests included -- to LastTest.log, unlike
    # --output-on-failure, which only echoes failing tests to the console.
    - name: Archive test log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: cpp_tests_${{ matrix.platform }}_${{ matrix.shard }}_${{ github.run_number }}
        path: build/Testing/Temporary/LastTest.log

# Summarize ###########################################################################################################

  Summarize:
    name: "Summarize | ${{ matrix.config.tag }} | ${{ matrix.config.build-type }}"
    needs: [preflight, regression]
    runs-on: ${{ matrix.config.os }}
    if: ${{ !cancelled() }}
    # id-token: write lets configure-aws-credentials fetch the GitHub OIDC token it exchanges for
    # the AWS role. Declaring any permission drops the rest to none, so the defaults the other
    # steps rely on (checkout, same-run artifact download) are restated.
    permissions:
      contents: read
      actions: read
      id-token: write

    env:
      regression-artifact-pattern: 'Regression_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.run_number }}_*'
      summary-artifact-name: Summary_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.run_number }}
      build-artifact-name: hlc_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ needs.preflight.outputs.hlc_run_number }}
      # The hlc build run under test (see preflight). ci_context.py records these in env.json,
      # event_coverage.py reads HLC_SHA, and the bucket upload attaches them as metadata.
      HLC_RUN_ID: ${{ needs.preflight.outputs.hlc_run_id }}
      HLC_RUN_NUMBER: ${{ needs.preflight.outputs.hlc_run_number }}
      HLC_RUN_ATTEMPT: ${{ needs.preflight.outputs.hlc_run_attempt }}
      HLC_BRANCH: ${{ needs.preflight.outputs.hlc_branch }}
      HLC_SHA: ${{ needs.preflight.outputs.hlc_sha }}

    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: ubuntu-26.04, tag: ubuntu, build-type: release }
        # - { os: windows-2022, tag: windows, build-type: release }

    steps:
    # The .hlc and test_*.cpp files are for the event coverage report; the golden logs under
    # hlc/ (~3 GB) are not needed, the report reads this run's regression logs instead.
    - name: Git Pull
      uses: actions/checkout@v6
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /scripts/
          /requirements.txt
          /hlc/**/*.hlc
          /hlc/**/test_*.cpp

    - name: Download artifact (build)
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.build-artifact-name }}
        run-id: ${{ env.HLC_RUN_ID }}
        repository: Apotell/hlc
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    # The installed event tables (share/hldb and share/hlc events.json) are all the coverage report
    # needs from it.
    - name: Extract event table
      shell: bash
      run: |
        tar xzfp ${{ env.build-artifact-name }}.tar.gz                    \
          ${{ env.build-artifact-name }}/share/hldb/events.json           \
          ${{ env.build-artifact-name }}/share/hlc/events.json
        rm ${{ env.build-artifact-name }}.tar.gz

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON3_VERSION }}
        architecture: 'x64'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Setup Python Packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    # NOTE: Minimum v8 is required here. Older versions do NOT support 'skip-decompress'
    # argument and the scripts are written with that assumption. upload-artifact@v7 and
    # download-artifact@v8 are *known* to be compatible.
    - name: Download regression artifact
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ env.regression-artifact-pattern }}
        skip-decompress: true
        merge-multiple: true

    - name: Run scanner
      timeout-minutes: 15
      run: |
        ls -lR
        python3 scripts/summarize.py                                              \
          ${{ github.workspace }}                                                 \
          Regression_ubuntu_release_${{ github.run_number }}_{index}              \
          --events-json ${{ env.build-artifact-name }}/share/hldb/events.json     \
                        ${{ env.build-artifact-name }}/share/hlc/events.json      \
          --jobs $(nproc)

    # Joins the diagnostics in this run's regression logs with the findEvent() checks in
    # hlc/**/test_*.cpp; writes report.xlsx and appends summary.md to the job summary.
    - name: Events coverage
      if: ${{ !cancelled() }}
      timeout-minutes: 15
      env:
        HLC_BUILD_NUMBER: ${{ env.HLC_RUN_NUMBER }}
        DAVTESTS_BRANCH: ${{ github.ref_name }}
      run: |
        python3 scripts/event_coverage.py                                         \
          --events-json ${{ env.build-artifact-name }}/share/hldb/events.json     \
                        ${{ env.build-artifact-name }}/share/hlc/events.json      \
          --test-dirpath hlc                                                      \
          --regression-archives "Regression_ubuntu_release_${{ github.run_number }}_*.zip" \
          --jobs $(nproc)

    - name: Archive artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.summary-artifact-name }}
        path: |
          events.log
          event_ids.csv
          tests.csv
          events.json
          env.json
          reducer.csv
          regression.csv
          report.xlsx
          summary.md

    # Upload to the bucket only when every step above succeeded, so a partial summary is never
    # pushed. The zip holds the same files as the Summary artifact, laid out the same way.
    - name: Configure AWS Credentials
      if: ${{ success() }}
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: ${{ secrets.AWS_DAVDASH_ROLE_ARN }}
        role-session-name: davtests-summarize-${{ github.run_id }}-${{ github.run_attempt }}
        aws-region: us-west-1

    - name: Upload file to bucket
      if: ${{ success() }}
      run: |
        zip ${{ env.summary-artifact-name }}.zip  \
          events.log                              \
          event_ids.csv                           \
          tests.csv                               \
          events.json                             \
          env.json                                \
          reducer.csv                             \
          regression.csv                          \
          report.xlsx                             \
          summary.md
        metadata="branch=${{ github.ref_name }}"
        metadata+=",platform=${{ matrix.config.tag }}"
        metadata+=",config=${{ matrix.config.build-type }}"
        metadata+=",run-id=${{ github.run_id }}"
        metadata+=",run-number=${{ github.run_number }}"
        metadata+=",run-attempt=${{ github.run_attempt }}"
        metadata+=",sha=${{ github.sha }}"
        metadata+=",hlc-run-id=${HLC_RUN_ID}"
        metadata+=",hlc-run-number=${HLC_RUN_NUMBER}"
        metadata+=",hlc-run-attempt=${HLC_RUN_ATTEMPT}"
        metadata+=",hlc-branch=${HLC_BRANCH}"
        metadata+=",hlc-sha=${HLC_SHA}"
        aws s3 cp ${{ env.summary-artifact-name }}.zip                                \
          s3://davdash-927676952993-us-west-1-an/${{ env.summary-artifact-name }}.zip \
          --metadata "$metadata"

    - name: Notify davdash
      continue-on-error: true   # a missed notification is caught by the next one
      run: >
        curl --fail-with-body -sS --retry 3 --retry-all-errors --max-time 30      \
          -X POST -H "Authorization: Bearer ${{ secrets.DAVDASH_NOTIFY_TOKEN }}"  \
          https://dashboards.davenche.com/api/notify


# Cache Cleanup #######################################################################################################

  # Cache entries are immutable, so every run saves a new timestamp-suffixed
  # entry. Keep only the newest entry per key prefix on this ref so frequently
  # run branches don't push other branches' caches out of the repo-wide quota.
  CacheCleanup:
    needs: [cpp_tests]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
    - name: Delete older caches on this ref
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # Strip ccache-action's trailing ISO timestamp ("-YYYY-MM-DDT...") to
        # group entries by prefix.
        gh cache list --ref "${{ github.ref }}" --limit 1000         \
          --json id,key,createdAt                                    \
          --jq 'group_by(.key | sub("-[0-9]{4}-[0-9]{2}-[0-9]{2}[T-].*$"; ""))
                | .[] | sort_by(.createdAt) | .[:-1][] | .id'        |
        while read -r id; do
          echo "Deleting cache ${id}"
          gh cache delete "${id}"
        done
