name: 'hlc'
run-name: "hlc #${{ github.event.inputs.run_number }} · ${{ github.event.inputs.context || github.ref }}"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.inputs.context || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      run_number:
        description: 'Build run number'
        type: number
        required: true
      run_id:
        description: 'Build run ID (from the url)'
        type: number
        required: true
      context:
        description: 'Triggering context (actor/branch)'
        type: string
        required: false
        default: master

env:
  PYTHON3_VERSION: '3.14'

jobs:
# Preflight ###########################################################################################################

  preflight:
    name: "Preflight | ubuntu"
    runs-on: ubuntu-latest

    steps:
    - name: Verify artifacts are accessible
      env:
        GH_TOKEN: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}
      run: |
        artifacts=$(gh api /repos/Apotell/hlc/actions/runs/${{ github.event.inputs.run_id }}/artifacts \
          --jq '.artifacts[].name')
        echo "Available artifacts:"
        echo "$artifacts"
        echo "$artifacts" | grep -q "hlc_ubuntu_release_${{ github.event.inputs.run_number }}" \
          || { echo "::error::Build artifact not found"; exit 1; }
        echo "$artifacts" | grep -q "pyhldb-" \
          || { echo "::error::pyhldb artifact not found"; exit 1; }

# Regression ##########################################################################################################

  regression:
    name: "Regression | ${{ matrix.config.tag }} | ${{ matrix.shard }}"
    needs: preflight
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        num_shards: [6]
        shard: [0, 1, 2, 3, 4, 5]
        config:
        - { os: ubuntu-26.04, tag: ubuntu, build-type: release }
        # - { os: windows-2022, tag: windows, build-type: release }

    env:
      build-artifact-name: hlc_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.event.inputs.run_number }}
      pyhldb-artifact-pattern: "pyhldb-*-linux_x86_64.whl"
      regression-artifact-name: Regression_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.run_number }}_${{ matrix.shard }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON3_VERSION }}
        architecture: 'x64'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Setup Python Packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Download artifact (build)
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.build-artifact-name }}
        run-id: ${{ github.event.inputs.run_id }}
        repository: Apotell/hlc
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Download artifact (pyhldb)
      uses: actions/download-artifact@v7
      with:
        pattern: ${{ env.pyhldb-artifact-pattern }}
        run-id: ${{ github.event.inputs.run_id }}
        repository: Apotell/hlc
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Extract build artifact
      shell: bash
      run: |
        # This has to be a separate step and run under bash since tar on Windows
        # still doesn't support symlink and the root repository folder is a symlink.
        tar xzfp ${{ env.build-artifact-name }}.tar.gz
        mv ${{ env.build-artifact-name }} build
        rm ${{ env.build-artifact-name }}.tar.gz

    - name: Run regression
      if: runner.os == 'Linux'
      shell: bash
      timeout-minutes: 60
      run: |
        python -m pip install $(ls ${{ env.pyhldb-artifact-pattern }} | head -n 1)

        python3 scripts/regression.py                         \
          --build-dirpath ${{ github.workspace }}/build/bin   \
          --hlc-filepath hlc                          \
          --reducer-filepath hldb-reduce                      \
          --output-dirpath ${{ github.workspace }}/regression \
          --jobs $(nproc)                                     \
          --num_shards=${{ matrix.num_shards }}               \
          --shard=${{ matrix.shard }}
        git status

    - name: Prepare regression artifacts
      if: ${{ !cancelled() }}
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        echo "$GITHUB_CONTEXT" > env.json
        mv regression/regression.csv .
        mv regression ${{ env.regression-artifact-name }}
        find ${{ env.regression-artifact-name }} -name "*.tar.gz" | tar czfp ${{ env.regression-artifact-name }}.tar.gz -T -

    - name: Archive artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.regression-artifact-name }}
        path: |
          ${{ env.regression-artifact-name }}.tar.gz
          env.json
          regression.csv

# C++ Tests ###########################################################################################################

  cpp_tests:
    name: "C++ Tests | ubuntu | release | shard ${{ matrix.shard }}/${{ matrix.num_shards }}"
    needs: preflight
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ubuntu, os: ubuntu-26.04, shard: 0, num_shards: 2 }
          - { platform: ubuntu, os: ubuntu-26.04, shard: 1, num_shards: 2 }

    env:
      build-artifact-name: hlc_${{ matrix.platform }}_release_${{ github.event.inputs.run_number }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build

    - name: Setup Clang
      uses: egor-tensin/setup-clang@v2

    - name: Setup compiler cache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        variant: 'ccache'
        key: "${{ matrix.platform }}-${{ github.ref_name }}/${{ matrix.shard }}"
        restore-keys: |
          ${{ matrix.platform }}-master/${{ matrix.shard }}
          ${{ matrix.platform }}-master
        evict-old-files: 'job'

    - name: Download artifact (build)
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.build-artifact-name }}
        run-id: ${{ github.event.inputs.run_id }}
        repository: Apotell/hlc
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Extract build artifact
      shell: bash
      run: |
        tar xzfp ${{ env.build-artifact-name }}.tar.gz
        mv ${{ env.build-artifact-name }} build

    - name: Generate shard list
      shell: bash
      run: |
        python3 scripts/shard_tests.py          \
          --test-dirpath hlc                    \
          --output scripts/shard.lst            \
          --shard ${{ matrix.shard }}           \
          --num_shards ${{ matrix.num_shards }}

    # The binary dir is the extracted hlc install itself (build/), so the test executables land in
    # build/bin next to hlc and its hlc.conf -- the same layout as other platforms. hlc loads
    # hlc.conf (and through it the precompiled UVM/OVM cache under share/hlc/pkg) from the running
    # executable's own directory, so a test binary built anywhere else silently runs uncached.
    - name: Configure
      env:
        CC: clang
        CXX: clang++
        SCCACHE_GHA_ENABLED: "true"
      run: |
        cmake                                                         \
          -G Ninja                                                    \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo                           \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache                          \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache                        \
          -DHLC_BUILD_DIR=${{ github.workspace }}/build               \
          -DTEST_LIST_FILE=${{ github.workspace }}/scripts/shard.lst  \
          -S . -B build

    - name: Build
      env:
        # Every test compiles against the shared davtests PCH. ccache refuses to cache those
        # compiles unless it is told to accept PCH use.
        CCACHE_SLOPPINESS: pch_defines,time_macros
      run: cmake --build build -j $(nproc)

    - name: Test
      timeout-minutes: 15
      run: ctest --test-dir build --output-on-failure -j $(nproc)

    # ctest writes every test's full output -- passing tests included -- to LastTest.log, unlike
    # --output-on-failure, which only echoes failing tests to the console.
    - name: Archive test log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: cpp_tests_${{ matrix.platform }}_${{ matrix.shard }}_${{ github.run_number }}
        path: build/Testing/Temporary/LastTest.log

# Summarize ###########################################################################################################

  Summarize:
    name: "Summarize | ${{ matrix.config.tag }} | ${{ matrix.config.build-type }}"
    needs: regression
    runs-on: ${{ matrix.config.os }}
    if: ${{ !cancelled() }}

    env:
      regression-artifact-pattern: 'Regression_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.run_number }}_*'
      summary-artifact-name: Summary_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.run_number }}
      build-artifact-name: hlc_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.event.inputs.run_number }}

    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: ubuntu-26.04, tag: ubuntu, build-type: release }
        # - { os: windows-2022, tag: windows, build-type: release }

    steps:
    # The .hlc and test_*.cpp files are for the event coverage report; the golden logs under
    # hlc/ (~3 GB) are not needed, the report reads this run's regression logs instead.
    - name: Git Pull
      uses: actions/checkout@v6
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /scripts/
          /requirements.txt
          /hlc/**/*.hlc
          /hlc/**/test_*.cpp

    - name: Resolve hlc commit of the build
      id: hlc-commit
      env:
        GH_TOKEN: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}
      run: |
        sha=$(gh api repos/Apotell/hlc/actions/runs/${{ github.event.inputs.run_id }} --jq '.head_sha')
        echo "hlc commit: $sha"
        echo "sha=$sha" >> $GITHUB_OUTPUT

    - name: Download artifact (build)
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.build-artifact-name }}
        run-id: ${{ github.event.inputs.run_id }}
        repository: Apotell/hlc
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    # The installed event tables (share/hldb and share/hlc events.json) are all the coverage report
    # needs from it.
    - name: Extract event table
      shell: bash
      run: |
        tar xzfp ${{ env.build-artifact-name }}.tar.gz                    \
          ${{ env.build-artifact-name }}/share/hldb/events.json           \
          ${{ env.build-artifact-name }}/share/hlc/events.json
        rm ${{ env.build-artifact-name }}.tar.gz

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON3_VERSION }}
        architecture: 'x64'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Setup Python Packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    # NOTE: Minimum v8 is required here. Older versions do NOT support 'skip-decompress'
    # argument and the scripts are written with that assumption. upload-artifact@v7 and
    # download-artifact@v8 are *known* to be compatible.
    - name: Download regression artifact
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ env.regression-artifact-pattern }}
        skip-decompress: true
        merge-multiple: true

    - name: Run scanner
      timeout-minutes: 15
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        ls -lR
        python3 scripts/summarize.py                                  \
          ${{ github.workspace }}                                     \
          Regression_ubuntu_release_${{ github.run_number }}_{index}  \
          --jobs $(nproc)

    # Joins the diagnostics in this run's regression logs with the findEvent() checks in
    # hlc/**/test_*.cpp; writes report.xlsx and appends summary.md to the job summary.
    - name: Events coverage
      if: ${{ !cancelled() }}
      timeout-minutes: 15
      env:
        HLC_BUILD_NUMBER: ${{ github.event.inputs.run_number }}
        HLC_SHA: ${{ steps.hlc-commit.outputs.sha }}
        DAVTESTS_BRANCH: ${{ github.ref_name }}
      run: |
        python3 scripts/event_coverage.py                                         \
          --events-json ${{ env.build-artifact-name }}/share/hldb/events.json     \
                        ${{ env.build-artifact-name }}/share/hlc/events.json      \
          --test-dirpath hlc                                                      \
          --regression-archives "Regression_ubuntu_release_${{ github.run_number }}_*.zip" \
          --jobs $(nproc)

    - name: Archive artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.summary-artifact-name }}
        path: |
          errors.log
          env.json
          reducer.csv
          regression.csv
          report.xlsx
          summary.md

# Cache Cleanup #######################################################################################################

  # Cache entries are immutable, so every run saves a new timestamp-suffixed
  # entry. Keep only the newest entry per key prefix on this ref so frequently
  # run branches don't push other branches' caches out of the repo-wide quota.
  CacheCleanup:
    needs: [cpp_tests]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
    - name: Delete older caches on this ref
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # Strip ccache-action's trailing ISO timestamp ("-YYYY-MM-DDT...") to
        # group entries by prefix.
        gh cache list --ref "${{ github.ref }}" --limit 1000         \
          --json id,key,createdAt                                    \
          --jq 'group_by(.key | sub("-[0-9]{4}-[0-9]{2}-[0-9]{2}[T-].*$"; ""))
                | .[] | sort_by(.createdAt) | .[:-1][] | .id'        |
        while read -r id; do
          echo "Deleting cache ${id}"
          gh cache delete "${id}"
        done
