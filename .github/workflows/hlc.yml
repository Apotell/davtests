name: 'hlc'
run-name: "hlc #${{ github.event.inputs.run_number }} · ${{ github.event.inputs.context || github.ref }}"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.inputs.context || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      run_number:
        description: 'Build run number'
        required: true
      run_id:
        description: 'Build run ID (from the url)'
        required: true
      context:
        description: 'Triggering context (actor/branch)'
        required: false
        default: master

env:
  PYTHON3_VERSION: '3.x'

jobs:
# Preflight ###########################################################################################################

  preflight:
    name: "Preflight | ubuntu"
    runs-on: ubuntu-latest

    steps:
    - name: Verify artifacts are accessible
      env:
        GH_TOKEN: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}
      run: |
        artifacts=$(gh api /repos/Apotell/hlc/actions/runs/${{ github.event.inputs.run_id }}/artifacts \
          --jq '.artifacts[].name')
        echo "Available artifacts:"
        echo "$artifacts"
        echo "$artifacts" | grep -q "hlc_ubuntu_release_${{ github.event.inputs.run_number }}" \
          || { echo "::error::Build artifact not found"; exit 1; }
        echo "$artifacts" | grep -q "pyuhdm-" \
          || { echo "::error::pyuhdm artifact not found"; exit 1; }

# Regression ##########################################################################################################

  regression:
    name: "Regression | ${{ matrix.config.tag }} | ${{ matrix.shard }}"
    needs: preflight
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        num_shards: [8]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        config:
        - { os: ubuntu-24.04, tag: ubuntu, build-type: release }
        # - { os: windows-2022, tag: windows, build-type: release }

    env:
      build-artifact-name: hlc_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.event.inputs.run_number }}
      pyuhdm-artifact-pattern: "pyuhdm-*-linux_x86_64.whl"
      regression-artifact-name: Regression_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.run_number }}_${{ matrix.shard }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON3_VERSION }}
        architecture: 'x64'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Setup Python Packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Download artifact (build)
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.build-artifact-name }}
        run-id: ${{ github.event.inputs.run_id }}
        repository: Apotell/hlc
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Download artifact (pyuhdm)
      uses: actions/download-artifact@v7
      with:
        pattern: ${{ env.pyuhdm-artifact-pattern }}
        run-id: ${{ github.event.inputs.run_id }}
        repository: Apotell/hlc
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Extract build artifact
      shell: bash
      run: |
        # This has to be a separate step and run under bash since tar on Windows
        # still doesn't support symlink and the root repository folder is a symlink.
        tar xzfp ${{ env.build-artifact-name }}.tar.gz
        mv ${{ env.build-artifact-name }} build
        rm ${{ env.build-artifact-name }}.tar.gz

    - name: Run regression
      if: runner.os == 'Linux'
      shell: bash
      timeout-minutes: 60
      run: |
        python -m pip install $(ls ${{ env.pyuhdm-artifact-pattern }} | head -n 1)

        python3 scripts/regression.py                         \
          --build-dirpath ${{ github.workspace }}/build/bin   \
          --surelog-filepath surelog                          \
          --reducer-filepath uhdm-reduce                      \
          --output-dirpath ${{ github.workspace }}/regression \
          --jobs $(nproc)                                     \
          --num_shards=${{ matrix.num_shards }}               \
          --shard=${{ matrix.shard }}
        git status

    - name: Prepare regression artifacts
      if: ${{ !cancelled() }}
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        echo "$GITHUB_CONTEXT" > env.json
        mv regression/regression.csv .
        mv regression ${{ env.regression-artifact-name }}
        find ${{ env.regression-artifact-name }} -name "*.tar.gz" | tar czfp ${{ env.regression-artifact-name }}.tar.gz -T -

    - name: Archive artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.regression-artifact-name }}
        path: |
          ${{ env.regression-artifact-name }}.tar.gz
          env.json
          regression.csv

# C++ Tests ###########################################################################################################

  cpp_tests:
    name: "C++ Tests | ubuntu | release"
    needs: preflight
    runs-on: ubuntu-24.04

    env:
      build-artifact-name: hlc_ubuntu_release_${{ github.event.inputs.run_number }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build

    - name: Setup Clang
      uses: egor-tensin/setup-clang@v2

    - name: Download artifact (build)
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.build-artifact-name }}
        run-id: ${{ github.event.inputs.run_id }}
        repository: Apotell/hlc
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Extract build artifact
      shell: bash
      run: |
        tar xzfp ${{ env.build-artifact-name }}.tar.gz
        mv ${{ env.build-artifact-name }} build

    - name: Configure
      run: |
        cmake                                       \
          -G Ninja                                  \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo         \
          -DHLC_BUILD_DIR=${{ github.workspace }}/build \
          -S . -B out/build

    - name: Build
      run: cmake --build out/build -j $(nproc)

    - name: Test
      run: ctest --test-dir out/build --output-on-failure

# Summarize ###########################################################################################################

  Summarize:
    name: "Summarize | ${{ matrix.config.tag }} | ${{ matrix.config.build-type }}"
    needs: regression
    runs-on: ${{ matrix.config.os }}
    if: ${{ !cancelled() }}

    env:
      regression-artifact-pattern: 'Regression_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.run_number }}_*'
      summary-artifact-name: Summary_${{ matrix.config.tag }}_${{ matrix.config.build-type }}_${{ github.run_number }}

    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: ubuntu-24.04, tag: ubuntu, build-type: release }
        # - { os: windows-2022, tag: windows, build-type: release }

    steps:
    - name: Git Pull
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          scripts
          requirements.txt

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON3_VERSION }}
        architecture: 'x64'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Setup Python Packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    # NOTE: Minimum v8 is required here. Older versions do NOT support 'skip-decompress'
    # argument and the scripts are written with that assumption. upload-artifact@v7 and
    # download-artifact@v8 are *known* to be compatible.
    - name: Download regression artifact
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ env.regression-artifact-pattern }}
        skip-decompress: true
        merge-multiple: true

    - name: Run scanner
      timeout-minutes: 15
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        ls -lR
        python3 scripts/summarize.py                                  \
          ${{ github.workspace }}                                     \
          Regression_ubuntu_release_${{ github.run_number }}_{index}  \
          --jobs $(nproc)

    - name: Archive artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.summary-artifact-name }}
        path: |
          errors.log
          env.json
          reducer.csv
          regression.csv
